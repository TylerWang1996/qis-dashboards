[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qis-risk"
version = "0.1.0"
description = "Portfolio correlation and diversification review for excess-return indices"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "scipy>=1.15",
]

[dependency-groups]
notebook = ["jupyterlab>=4.3", "ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["qis_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
